name: Noodl browser UX
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Start Vite
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/noodl-vite.log 2>&1 &
          echo $! > /tmp/noodl-vite.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/noodl-vite.log
          exit 1
      - run: node scripts/smoke-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noodl-browser-screenshots
          path: artifacts/ui/
          if-no-files-found: ignore
