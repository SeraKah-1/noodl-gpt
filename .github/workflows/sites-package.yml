name: OpenAI Sites release candidate
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build and verify Worker
        run: npm run build
      - name: Package for existing OpenAI Sites project
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.project_id == "appgprj_6afa4fd4b5448191a94055541e506c3a" and .d1 == "DB" and (.capabilities | index("mcp"))' .openai/hosting.json
          test -s dist/server/index.js
          test -s drizzle/0000_initial.sql
          test -s drizzle/meta/_journal.json
          test -s migrations/0001_initial.sql
          tar -czf noodl-sites-release.tar.gz .openai/hosting.json dist/server/index.js drizzle migrations
          tar -tzf noodl-sites-release.tar.gz | tee sites-release-contents.txt
          for required in .openai/hosting.json dist/server/index.js drizzle/0000_initial.sql drizzle/meta/_journal.json migrations/0001_initial.sql; do
            grep -Fx "$required" sites-release-contents.txt
          done
          sha256sum noodl-sites-release.tar.gz > noodl-sites-release.sha256
          cat noodl-sites-release.sha256
      - name: Save deployable candidate (does not deploy)
        uses: actions/upload-artifact@v4
        with:
          name: noodl-sites-release-candidate
          path: |
            noodl-sites-release.tar.gz
            noodl-sites-release.sha256
            sites-release-contents.txt
          if-no-files-found: error
          retention-days: 30
